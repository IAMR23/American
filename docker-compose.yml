services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - public
      - private

  mongo:
    image: mongo:6.0
    container_name: karaoke_mongo
    command: ["--auth", "--bind_ip_all"]
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: karaoke
    volumes:
      - mongo-data:/data/db
      - ./mongo-backups:/data/backup
    restart: always
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karaoke_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/karaoke?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PAYPAL_API: ${PAYPAL_API}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - private
      - public-internet
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
    container_name: karaoke_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bookstore-mongo:
    image: mongo:8.0
    container_name: bookstore_mongo
    command: ["--auth", "--bind_ip_all"]
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${BOOKSTORE_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${BOOKSTORE_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${BOOKSTORE_MONGO_DATABASE:-book_store}
    volumes:
      - bookstore-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bookstore-backend:
    build:
      context: ./backend_bookstore
      dockerfile: Dockerfile
    container_name: bookstore_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${BOOKSTORE_MONGO_ROOT_USERNAME}:${BOOKSTORE_MONGO_ROOT_PASSWORD}@bookstore-mongo:27017/${BOOKSTORE_MONGO_DATABASE:-book_store}?authSource=admin
      CORS_ORIGIN: ${BOOKSTORE_CORS_ORIGIN}
      JWT_SECRET: ${BOOKSTORE_JWT_SECRET}
      JWT_EXPIRES_HOURS: ${BOOKSTORE_JWT_EXPIRES_HOURS:-12}
      COOKIE_SECURE: ${BOOKSTORE_COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: /uploads
      MAX_IMAGE_MB: ${BOOKSTORE_MAX_IMAGE_MB:-10}
      READING_WINDOW_HOURS: ${BOOKSTORE_READING_WINDOW_HOURS:-24}
      PDF_ALLOWED_HOSTS: ${BOOKSTORE_PDF_ALLOWED_HOSTS:-dropbox.com,www.dropbox.com,dl.dropboxusercontent.com}
      FRONTEND_URL: ${BOOKSTORE_FRONTEND_URL}
      SMTP_HOST: ${BOOKSTORE_SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${BOOKSTORE_SMTP_PORT:-587}
      SMTP_SECURE: ${BOOKSTORE_SMTP_SECURE:-false}
      SMTP_USER: ${BOOKSTORE_SMTP_USER:-}
      SMTP_PASS: ${BOOKSTORE_SMTP_PASS:-}
      EMAIL_FROM: ${BOOKSTORE_EMAIL_FROM:-}
    volumes:
      - bookstore-media-data:/app/uploads
    depends_on:
      bookstore-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - private
      - public-internet
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bookstore-frontend:
    build:
      context: ./frontend_bookstore
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BOOKSTORE_VITE_API_URL:-/api}
    container_name: bookstore_frontend
    restart: always
    depends_on:
      bookstore-backend:
        condition: service_healthy
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  npm-data:
  npm-letsencrypt:
  mongo-data:
  bookstore-mongo-data:
  bookstore-media-data:

networks:
  public:
  private:
    internal: true
  public-internet:
    driver: bridge
